# Pull identity the guest uses for `bootc upgrade` from box1-ci/rhel-image-poc.
# box1-gitops grants system:serviceaccounts:rhel-image-poc system:image-puller
# in box1-ci (platform/pipelines/ci/rhel-image-poc.yaml). The token controller
# fills the Secret; no credential value is stored in Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhel-image-poc-updater
  namespace: rhel-image-poc
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: rhel-image-poc-updater-token
  namespace: rhel-image-poc
  annotations:
    kubernetes.io/service-account.name: rhel-image-poc-updater
type: kubernetes.io/service-account-token
